<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
    <title>原辅料</title>
    <style>
        * { margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; background: #D74B28; }
    </style>
</head>
<body>
<script>
var SAP_URL = 'https://s4hdev.whchem.com:9943/sap/bc/ui2/flp?sap-client=710&sap-language=ZH#ZMM_RAWMATER-manage';

// 注入到 SAP WebView 的打印拦截脚本
// 注入到 SAP WebView：window.print 被调用时跳转自定义 scheme，不调用任何 plus API
var PRINT_INJECT =
    'if (!window.__printPatched) {' +
    '  window.__printPatched = true;' +
    '  window.print = function() { location.href = "sapprint://go"; };' +
    '}';

function doPrint(sapView) {
    if (plus.os.name === 'Android') {
        try {
            var context = plus.android.runtimeMainActivity();
            var pm = plus.android.invoke(context, 'getSystemService', 'print');
            var nativeWV = sapView.nativeInstanceObject();
            var adapter = plus.android.invoke(nativeWV, 'createPrintDocumentAdapter', '原辅料打印');
            plus.android.invoke(pm, 'print', '原辅料打印', adapter, null);
        } catch (e) {
            plus.nativeUI.toast('打印失败: ' + e.message);
        }
    } else if (plus.os.name === 'iOS') {
        try {
            var UIPrintInteractionController = plus.ios.importClass('UIPrintInteractionController');
            var UIPrintInfo = plus.ios.importClass('UIPrintInfo');
            var controller = UIPrintInteractionController.sharedPrintController();
            var printInfo = UIPrintInfo.printInfo();
            printInfo.plusSetAttribute('outputType', 0);
            printInfo.plusSetAttribute('jobName', '原辅料打印');
            controller.plusSetAttribute('printInfo', printInfo);
            var nativeWV = sapView.nativeInstanceObject();
            var formatter = plus.ios.invoke(nativeWV, 'viewPrintFormatter');
            controller.plusSetAttribute('printFormatter', formatter);
            controller.plusCallMethod({presentAnimated: [true, null]});
        } catch (e) {
            plus.nativeUI.toast('打印失败: ' + e.message);
        }
    }
}

function plusReady() {
    plus.navigator.setStatusBarBackground('#D74B28');

    var sapView = plus.webview.create(SAP_URL, 'sap-main', {
        top: 0,
        bottom: 0,
        bounce: 'none'
    });

    // 拦截自定义 scheme，触发原生打印
    sapView.overrideUrlLoading({mode: 'reject', match: 'sapprint://.*'}, function(e) {
        doPrint(sapView);
    });

    var firstLoad = true;
    sapView.addEventListener('loaded', function() {
        sapView.evalJS(PRINT_INJECT);
        if (firstLoad) {
            firstLoad = false;
            plus.navigator.closeSplashscreen();
            sapView.show('none');
        }
    }, false);

    // 返回键：SAP 页面内有历史则后退，否则弹确认退出
    plus.key.addEventListener('backbutton', function() {
        sapView.canBack(function(e) {
            if (e.canBack) {
                sapView.back();
            } else {
                var isIOS = (plus.os.name === 'iOS');
                if (isIOS) {
                    plus.nativeUI.confirm('确认退出？', function(ev) {
                        if (ev.index > 0) plus.runtime.quit();
                    }, '原辅料', ['取消', '确定']);
                } else {
                    confirm('确认退出？') && plus.runtime.quit();
                }
            }
        });
    }, false);
}

if (window.plus) {
    plusReady();
} else {
    document.addEventListener('plusready', plusReady, false);
}
</script>
</body>
</html>
