<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
    <title>原辅料</title>
    <style>
        * { margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; background: #D74B28; }
    </style>
</head>
<body>
<script>
var SAP_URL = 'https://s4hdev.whchem.com:9943/sap/bc/ui2/flp?sap-client=710&sap-language=ZH#ZMM_RAWMATER-manage';

// 注入到 SAP WebView 的打印拦截脚本
// 注入到 SAP WebView 的代码极简：只覆盖 window.print，跳转自定义 scheme
// 不在这里调用任何 plus.* API，避免远程 WebView 上下文问题
var PRINT_INJECT =
    'if (!window.__printPatched) {' +
    '  window.__printPatched = true;' +
    '  window.print = function() {' +
    '    document.location.href = "sapprint://go";' +
    '  };' +
    '}';

function plusReady() {
    plus.navigator.setStatusBarBackground('#D74B28');

    var sapView = plus.webview.create(SAP_URL, 'sap-main', {
        top: 0,
        bottom: 0,
        bounce: 'none'
    });

    // 拦截 SAP WebView 内的 URL 跳转，捕获自定义 scheme
    sapView.addEventListener('overrideUrlLoading', function(e) {
        if (e.url && e.url.indexOf('sapprint://') === 0) {
            // 打印逻辑全部在 loader.html（本地 WebView）里执行，plus 调用完全没问题
            var printUrl = SAP_URL;
            plus.printer.print(printUrl, {},
                function() { plus.nativeUI.toast('打印成功'); },
                function(err) { plus.nativeUI.toast('打印失败: ' + (err.message || err)); }
            );
        }
    }, false);

    var firstLoad = true;
    sapView.addEventListener('loaded', function() {
        sapView.evalJS(PRINT_INJECT);
        if (firstLoad) {
            firstLoad = false;
            plus.navigator.closeSplashscreen();
            sapView.show('none');
        }
    }, false);

    // 返回键：SAP 页面内有历史则后退，否则弹确认退出
    plus.key.addEventListener('backbutton', function() {
        sapView.canBack(function(e) {
            if (e.canBack) {
                sapView.back();
            } else {
                var isIOS = (plus.os.name === 'iOS');
                if (isIOS) {
                    plus.nativeUI.confirm('确认退出？', function(ev) {
                        if (ev.index > 0) plus.runtime.quit();
                    }, '原辅料', ['取消', '确定']);
                } else {
                    confirm('确认退出？') && plus.runtime.quit();
                }
            }
        });
    }, false);
}

if (window.plus) {
    plusReady();
} else {
    document.addEventListener('plusready', plusReady, false);
}
</script>
</body>
</html>
